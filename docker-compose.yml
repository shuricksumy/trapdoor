# tunnelward: OpenVPN server + agent + web UI.
#
#   cp .env.example .env    # set TW_AGENT_TOKEN, time zone, ...
#   docker compose up -d
#   docker compose exec -it web tunnelward user add admin
#
# Point OPENVPN_DIR at an existing OpenVPN directory (e.g. from openvpn-ui), or
# see README "Docker" for a new install. The web UI listens on 127.0.0.1:8080:
# put it behind an HTTPS reverse proxy.

x-image: &image
  image: ${TW_IMAGE:-ghcr.io/shuricksumy/tunnelward:latest}
  restart: unless-stopped

services:
  # The only container with network privileges.
  openvpn:
    <<: *image
    user: root
    entrypoint: ["openvpn-entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      VPN_NAT_SUBNET: ${VPN_NAT_SUBNET:-}
    ports:
      - "${VPN_PORT:-1194}:1194/udp"
    volumes:
      - ${OPENVPN_DIR:-./openvpn}:/etc/openvpn

  # Manages PKI and OpenVPN. Shares the openvpn container's network, so the
  # management interface stays on 127.0.0.1 and is never published.
  agent:
    <<: *image
    user: root # owns the files in /etc/openvpn
    command: ["agent"]
    network_mode: service:openvpn
    depends_on: [openvpn]
    environment:
      TW_AGENT_TOKEN: ${TW_AGENT_TOKEN:?set TW_AGENT_TOKEN in .env}
      TW_AGENT_LISTEN: unix:/run/tunnelward/agent.sock
      TW_AGENT_SOCKET_GID: "10001" # lets the non-root web container connect
      TW_OPENVPN_MGMT: ${TW_OPENVPN_MGMT:-127.0.0.1:2080}
      TW_OPENVPN_RESTART: SIGTERM # the openvpn service starts OpenVPN again
      TW_OPENVPN_MGMT_PASSWORD: ${TW_OPENVPN_MGMT_PASSWORD:-}
    volumes:
      - ${OPENVPN_DIR:-./openvpn}:/etc/openvpn
      - run:/run/tunnelward
    healthcheck:
      test: ["CMD", "tunnelward", "health", "unix:/run/tunnelward/agent.sock"]
      interval: 30s
      timeout: 5s
      start_period: 5s

  # Web UI and API. Unprivileged: no capabilities, read-only filesystem.
  web:
    <<: *image
    command: ["web"]
    depends_on: [agent]
    environment:
      TW_AGENT_TOKEN: ${TW_AGENT_TOKEN:?set TW_AGENT_TOKEN in .env}
      TW_AGENT_URL: unix:/run/tunnelward/agent.sock
      TW_TZ: ${TW_TZ:-UTC}
      TW_COOKIE_SECURE: ${TW_COOKIE_SECURE:-true}
      TW_TRUSTED_PROXIES: ${TW_TRUSTED_PROXIES:-}
      TW_WEB_API_TOKEN: ${TW_WEB_API_TOKEN:-}
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - web-data:/data
      - run:/run/tunnelward
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "tunnelward", "health", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      start_period: 5s

volumes:
  run: {}
  web-data: {}
