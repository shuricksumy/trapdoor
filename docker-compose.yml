# trapdoor: OpenVPN / WireGuard / AmneziaWG servers + agent + web UI, from the published image.
#
#   cp .env.example .env              # set TD_AGENT_TOKEN (openssl rand -hex 32)
#   docker compose up -d
#   docker compose exec -it web trapdoor user add admin
#
# Then open http://127.0.0.1:8080 (WEB_BIND) and follow the setup. An existing
# OpenVPN server (e.g. from openvpn-ui): point OPENVPN_DIR at its directory.
# Behind Traefik: add docker-compose.traefik.yml (see the comment there).
# Anything else with HTTPS works too: proxy to WEB_BIND.

x-image: &image
  image: ${TD_IMAGE:-ghcr.io/shuricksumy/trapdoor:latest}
  restart: unless-stopped

services:
  # Runs the VPN servers (OpenVPN, WireGuard, AmneziaWG); the only container
  # with network privileges.
  vpn:
    <<: *image
    user: root
    entrypoint: ["vpn-entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      VPN_NAT_SUBNET: ${VPN_NAT_SUBNET:-auto}
    ports:
      - "${VPN_PORT:-1194}:1194/${VPN_PROTO:-udp}"
      # A second OpenVPN server added in trapdoor: the same port inside and outside
      - "${VPN2_PORT:-1195}:${VPN2_PORT:-1195}/${VPN2_PROTO:-tcp}"
      # WireGuard: the same port inside and outside; create the server with it
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
      # AmneziaWG: the same, for the first AmneziaWG server
      - "${AWG_PORT:-51830}:${AWG_PORT:-51830}/udp"
    volumes:
      - ${OPENVPN_DIR:-./openvpn}:/etc/openvpn
      - ${WIREGUARD_DIR:-./wireguard}:/etc/wireguard
      - ${AMNEZIAWG_DIR:-./amneziawg}:/etc/amnezia/amneziawg

  # Manages PKI and OpenVPN. Shares the vpn container's network, so the
  # management interface stays on 127.0.0.1 and is never published.
  agent:
    <<: *image
    user: root # owns the files in /etc/openvpn
    command: ["agent"]
    network_mode: service:vpn
    depends_on: [vpn]
    environment:
      TD_AGENT_TOKEN: ${TD_AGENT_TOKEN:?set TD_AGENT_TOKEN in .env}
      TD_AGENT_LISTEN: unix:/run/trapdoor/agent.sock
      TD_AGENT_SOCKET_GID: "10001" # lets the non-root web container connect
      TD_OPENVPN_MGMT: ${TD_OPENVPN_MGMT:-127.0.0.1:2080}
      TD_OPENVPN_RESTART: SIGTERM # the vpn service starts OpenVPN again
      TD_FIREWALL: file # access rules are applied by the vpn service
      TD_SCRIPTS: ${TD_SCRIPTS:-off} # on: own start / stop scripts editable in the web UI (run as root in the vpn container)
      TD_WIREGUARD: file # WireGuard and AmneziaWG interfaces are run by the vpn service
      # Shown in the UI: the container that runs each type of server
      TD_CONTAINER_OPENVPN: vpn
      TD_CONTAINER_WIREGUARD: vpn
      TD_CONTAINER_AMNEZIAWG: vpn
      # Shown in the UI as machine › node (Nodes page)
      TD_MACHINE: ${TD_MACHINE:-}
      TD_NODE_NAME: ${TD_NODE_NAME:-}
      TD_OPENVPN_MGMT_PASSWORD: ${TD_OPENVPN_MGMT_PASSWORD:-}
      # the setup keeps OpenVPN on the published port
      TD_SETUP_PORT: "1194"
      TD_SETUP_PROTO: ${VPN_PROTO:-udp}
      TD_SETUP_PUBLIC_PORT: ${VPN_PORT:-1194}
      TD_TOTP_ISSUER: ${TD_TOTP_ISSUER:-trapdoor}
    volumes:
      - ${OPENVPN_DIR:-./openvpn}:/etc/openvpn
      - ${WIREGUARD_DIR:-./wireguard}:/etc/wireguard
      - ${AMNEZIAWG_DIR:-./amneziawg}:/etc/amnezia/amneziawg
      - run:/run/trapdoor
    healthcheck:
      test: ["CMD", "trapdoor", "health", "unix:/run/trapdoor/agent.sock"]
      interval: 30s
      timeout: 5s
      start_period: 5s

  # Web UI and API. Unprivileged: no capabilities, read-only filesystem.
  web:
    <<: *image
    command: ["web"]
    depends_on: [agent]
    environment:
      TD_AGENT_TOKEN: ${TD_AGENT_TOKEN:?set TD_AGENT_TOKEN in .env}
      TD_AGENT_URL: unix:/run/trapdoor/agent.sock
      TD_TZ: ${TD_TZ:-UTC}
      TD_COOKIE_SECURE: ${TD_COOKIE_SECURE:-true}
      TD_TRUSTED_PROXIES: ${TD_TRUSTED_PROXIES:-}
      TD_WEB_API_TOKEN: ${TD_WEB_API_TOKEN:-}
      TD_PUBLIC_URL: ${TD_PUBLIC_URL:-} # link in notification emails
      TD_BACKUP_PASSPHRASE: ${TD_BACKUP_PASSPHRASE:-} # encrypts scheduled backups (Account → Scheduled backups)
      TD_JOIN_SECRET: ${TD_JOIN_SECRET:-} # optional: nodes started with it join by themselves
      TD_EXPIRY_WARN_DAYS: ${TD_EXPIRY_WARN_DAYS:-30}
      TD_SESSION_IDLE: ${TD_SESSION_IDLE:-12h}
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - web-data:/data
      # - ./backups:/data/backups   # scheduled backups in a host folder (sudo chown 10001 ./backups)
      - run:/run/trapdoor
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "trapdoor", "health", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      start_period: 5s

volumes:
  run: {}
  web-data: {}
