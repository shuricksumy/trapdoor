# Variant: WireGuard and AmneziaWG on the host's network instead of a Docker network.
#
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d
#
# No Docker port publishing or Docker NAT in the path: the interfaces and their iptables
# rules are on the host itself, and every WireGuard server's port is open as soon as it
# exists. The agent listens on the host's TCP 9443: allow it only from where the web UI
# runs, and add the host in the web UI as https://host.docker.internal:9443 (the
# openvpn stack's docker-compose.host-access.yml makes that name work).

#
# Docker cannot set sysctls in the host's network namespace: turn on IP forwarding on the
# host itself (once, and in /etc/sysctl.d/ to keep it after a reboot):
#   sudo sysctl -w net.ipv4.ip_forward=1

services:
  vpn:
    network_mode: host
    ports: !reset []
    networks: !reset {}
    sysctls: !reset []
