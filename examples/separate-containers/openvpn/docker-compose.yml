# Separate containers, part 1: the web UI and the OpenVPN servers.
# Part 2 (../wireguard) runs WireGuard and AmneziaWG in its own vpn container;
# this stack's web UI manages it as a host over the shared network "trapdoor".
#
#   cp .env.example .env              # set TD_AGENT_TOKEN (openssl rand -hex 32)
#   docker compose up -d              # first: it creates the network "trapdoor"
#   docker compose exec -it web trapdoor user add admin
#
# See README.md in the folder above.

x-image: &image
  image: ${TD_IMAGE:-ghcr.io/shuricksumy/trapdoor:latest}
  restart: unless-stopped

services:
  # Runs the OpenVPN servers; the only container of this stack with network privileges.
  vpn:
    <<: *image
    user: root
    entrypoint: ["vpn-entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      VPN_NAT_SUBNET: ${VPN_NAT_SUBNET:-auto}
    ports:
      - "${VPN_PORT:-1194}:1194/${VPN_PROTO:-udp}"
      - "${VPN2_PORT:-1195}:${VPN2_PORT:-1195}/${VPN2_PROTO:-tcp}"
    volumes:
      - ${OPENVPN_DIR:-./openvpn}:/etc/openvpn

  agent:
    <<: *image
    user: root
    command: ["agent"]
    network_mode: service:vpn
    depends_on: [vpn]
    environment:
      TD_AGENT_TOKEN: ${TD_AGENT_TOKEN:?set TD_AGENT_TOKEN in .env}
      TD_AGENT_LISTEN: unix:/run/trapdoor/agent.sock
      TD_AGENT_SOCKET_GID: "10001"
      TD_OPENVPN_MGMT: 127.0.0.1:2080
      TD_OPENVPN_RESTART: SIGTERM
      TD_FIREWALL: file
      TD_WIREGUARD: "off" # WireGuard and AmneziaWG run in the other stack
      TD_OPENVPN_MGMT_PASSWORD: ${TD_OPENVPN_MGMT_PASSWORD:-}
      TD_SETUP_PORT: "1194"
      TD_SETUP_PROTO: ${VPN_PROTO:-udp}
      TD_SETUP_PUBLIC_PORT: ${VPN_PORT:-1194}
      TD_TOTP_ISSUER: ${TD_TOTP_ISSUER:-trapdoor}
    volumes:
      - ${OPENVPN_DIR:-./openvpn}:/etc/openvpn
      - run:/run/trapdoor
    healthcheck:
      test: ["CMD", "trapdoor", "health", "unix:/run/trapdoor/agent.sock"]
      interval: 30s
      timeout: 5s
      start_period: 5s

  web:
    <<: *image
    command: ["web"]
    depends_on: [agent]
    environment:
      TD_AGENT_TOKEN: ${TD_AGENT_TOKEN:?set TD_AGENT_TOKEN in .env}
      TD_AGENT_URL: unix:/run/trapdoor/agent.sock
      TD_TZ: ${TD_TZ:-UTC}
      TD_COOKIE_SECURE: ${TD_COOKIE_SECURE:-true}
      TD_TRUSTED_PROXIES: ${TD_TRUSTED_PROXIES:-}
      TD_WEB_API_TOKEN: ${TD_WEB_API_TOKEN:-}
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    networks: [default, trapdoor]
    volumes:
      - web-data:/data
      - run:/run/trapdoor
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "trapdoor", "health", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      start_period: 5s

networks:
  # Shared with ../wireguard: the web UI reaches the other agent here.
  trapdoor:
    name: trapdoor

volumes:
  run: {}
  web-data: {}
