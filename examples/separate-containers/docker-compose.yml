# Separate containers: one compose file, one web UI and one agent, and a vpn container
# per VPN type, each with its own folder, network stack, NAT, firewall and ports.
#
#   cp .env.example .env              # set TD_AGENT_TOKEN (openssl rand -hex 32)
#   docker compose up -d
#   docker compose exec -it web trapdoor user add admin
#
# ./openvpn    OpenVPN servers (PKI, server.conf, ccd, added servers)   → vpn-openvpn
# ./wireguard  WireGuard servers (<id>.json, <id>.conf)                → vpn-wireguard
# ./amneziawg  AmneziaWG servers                                       → vpn-amneziawg
#
# The agent writes all three folders; each vpn container sees only its own and runs
# what it finds there. Only OpenVPN needs the agent next to it (its management
# interface stays on 127.0.0.1); WireGuard and AmneziaWG are driven through files.
# WireGuard on the host's network: add docker-compose.host.yml (see README.md).

x-image: &image
  image: ${TD_IMAGE:-ghcr.io/shuricksumy/trapdoor:latest}
  restart: unless-stopped

# The privileges every vpn container needs, nothing more.
x-vpn: &vpn
  <<: *image
  user: root
  entrypoint: ["vpn-entrypoint.sh"]
  cap_add: [NET_ADMIN]
  devices: [/dev/net/tun]
  sysctls:
    - net.ipv4.ip_forward=1

services:
  vpn-openvpn:
    <<: *vpn
    environment:
      VPN_NAT_SUBNET: ${VPN_NAT_SUBNET:-auto}
    ports:
      - "${VPN_PORT:-1194}:1194/${VPN_PROTO:-udp}"
      - "${VPN2_PORT:-1195}:${VPN2_PORT:-1195}/${VPN2_PROTO:-tcp}"
    volumes:
      - ${OPENVPN_DIR:-./openvpn}:/etc/openvpn

  vpn-wireguard:
    <<: *vpn
    environment:
      VPN_NAT_IFACE: ${VPN_NAT_IFACE:-} # empty: the default route's interface
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    volumes:
      - ${WIREGUARD_DIR:-./wireguard}:/etc/wireguard

  vpn-amneziawg:
    <<: *vpn
    environment:
      VPN_NAT_IFACE: ${VPN_NAT_IFACE:-}
    ports:
      - "${AWG_PORT:-51830}:${AWG_PORT:-51830}/udp"
    volumes:
      - ${AMNEZIAWG_DIR:-./amneziawg}:/etc/amnezia/amneziawg

  # Writes the configuration of all three; shares vpn-openvpn's network for OpenVPN's
  # management interface. No network privileges of its own.
  agent:
    <<: *image
    user: root
    command: ["agent"]
    network_mode: service:vpn-openvpn
    depends_on: [vpn-openvpn, vpn-wireguard, vpn-amneziawg]
    environment:
      TD_AGENT_TOKEN: ${TD_AGENT_TOKEN:?set TD_AGENT_TOKEN in .env}
      TD_AGENT_LISTEN: unix:/run/trapdoor/agent.sock
      TD_AGENT_SOCKET_GID: "10001"
      TD_OPENVPN_MGMT: 127.0.0.1:2080
      TD_OPENVPN_RESTART: SIGTERM # vpn-openvpn starts OpenVPN again
      TD_FIREWALL: file # each vpn container applies its servers' rules
      TD_WIREGUARD: file # vpn-wireguard / vpn-amneziawg run the interfaces
      # Shown in the UI next to every server: which container runs it
      TD_CONTAINER_OPENVPN: vpn-openvpn
      TD_CONTAINER_WIREGUARD: vpn-wireguard
      TD_CONTAINER_AMNEZIAWG: vpn-amneziawg
      TD_OPENVPN_MGMT_PASSWORD: ${TD_OPENVPN_MGMT_PASSWORD:-}
      TD_SETUP_PORT: "1194"
      TD_SETUP_PROTO: ${VPN_PROTO:-udp}
      TD_SETUP_PUBLIC_PORT: ${VPN_PORT:-1194}
      TD_TOTP_ISSUER: ${TD_TOTP_ISSUER:-trapdoor}
    volumes:
      - ${OPENVPN_DIR:-./openvpn}:/etc/openvpn
      - ${WIREGUARD_DIR:-./wireguard}:/etc/wireguard
      - ${AMNEZIAWG_DIR:-./amneziawg}:/etc/amnezia/amneziawg
      - run:/run/trapdoor
    healthcheck:
      test: ["CMD", "trapdoor", "health", "unix:/run/trapdoor/agent.sock"]
      interval: 30s
      timeout: 5s
      start_period: 5s

  web:
    <<: *image
    command: ["web"]
    depends_on: [agent]
    environment:
      TD_AGENT_TOKEN: ${TD_AGENT_TOKEN:?set TD_AGENT_TOKEN in .env}
      TD_AGENT_URL: unix:/run/trapdoor/agent.sock
      TD_TZ: ${TD_TZ:-UTC}
      TD_COOKIE_SECURE: ${TD_COOKIE_SECURE:-true}
      TD_TRUSTED_PROXIES: ${TD_TRUSTED_PROXIES:-}
      TD_WEB_API_TOKEN: ${TD_WEB_API_TOKEN:-}
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - web-data:/data
      - run:/run/trapdoor
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "trapdoor", "health", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      start_period: 5s

volumes:
  run: {}
  web-data: {}
