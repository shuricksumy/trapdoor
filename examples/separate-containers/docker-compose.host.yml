# Variant: WireGuard on the host's network.
#
#   sudo sysctl -w net.ipv4.ip_forward=1        # Docker cannot set it in the host namespace
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d
#
# wg0, wg1, … and their iptables rules are on the host itself: no Docker port publishing
# or Docker NAT in the path, and a new WireGuard server's port is open as soon as it
# exists (no compose change). OpenVPN and AmneziaWG stay in their own containers.
# NAT leaves through the host's default route; set VPN_NAT_IFACE if that is not right.

services:
  vpn-wireguard:
    network_mode: host
    ports: !reset []
    sysctls: !reset []
