name: Build and publish Docker image

on:
  push:
    # Every push to main publishes :latest (+ a short-sha tag); the Release workflow adds X.Y.Z / X.Y.
    branches: ["main"]
    tags: ["v*.*.*"]
  # Renovate and Dependabot merge their own PRs once this build passes
  # (required by the main-branch ruleset), so PRs build the image too.
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build the image and run the real compose setup: setup wizard, a VPN
  # client on the host, revoke, restart with rollback, access rules.
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: trapdoor:smoke
          build-args: |
            VERSION=smoke
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose files are valid (plain and with Traefik)
        run: |
          export TD_AGENT_TOKEN=x
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.traefik.yml config --format json > traefik.json
          jq -e '(.services.web.ports // []) == [] and (.services.web.labels["traefik.enable"] == "true")' traefik.json

      - name: Install openvpn (VPN client on the host)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openvpn

      - name: Smoke test
        run: test/docker/smoke.sh trapdoor:smoke

  build-and-push:
    needs: smoke
    # Pull requests only need to prove the image builds and works (smoke).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
