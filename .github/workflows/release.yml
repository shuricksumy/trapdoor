name: Release

# Run from the Actions tab: enter a version (e.g. 1.0.0). Tests run, then the
# vX.Y.Z tag and GitHub release are created from main with Linux binaries
# attached, and the X.Y.Z, X.Y and latest images are published. Release notes
# come from docs/releases/vX.Y.Z.md when that file exists, otherwise GitHub
# generates them from merged PRs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 1.0.0"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::run this from main"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build binaries (web UI embedded)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          make ui
          mkdir -p dist
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for target in amd64 arm64 arm:7; do
            arch=${target%%:*}; arm=${target#*:}; [ "$arm" = "$target" ] && arm=
            name="tunnelward_${VERSION}_linux_${arch}${arm:+v$arm}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$arm go build -trimpath \
              -ldflags "-s -w -X github.com/shuricksumy/tunnelward/internal/version.Version=$VERSION -X github.com/shuricksumy/tunnelward/internal/version.Commit=$GITHUB_SHA -X github.com/shuricksumy/tunnelward/internal/version.Date=$date" \
              -o "build/$name/tunnelward" ./cmd/tunnelward
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          notes="docs/releases/v${VERSION}.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --latest "${args[@]}" dist/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
