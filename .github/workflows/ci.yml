name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: make build && ./bin/tunnelward version

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type-check and build
        run: make ui

  # PKI compatibility against the real easyrsa + openssl CLIs.
  compat:
    runs-on: ubuntu-latest
    env:
      EASYRSA_VERSION: 3.2.7
      EASYRSA_SHA256: 308743bc9fe871b902d47dbe98d749daff3a05b27531684f02625ce7208d4598
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download easyrsa
        run: |
          curl -fsSL -o easyrsa.tgz \
            "https://github.com/OpenVPN/easy-rsa/releases/download/v${EASYRSA_VERSION}/EasyRSA-${EASYRSA_VERSION}.tgz"
          echo "${EASYRSA_SHA256}  easyrsa.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/easyrsa"
          tar -xzf easyrsa.tgz -C "$RUNNER_TEMP/easyrsa" --strip-components=1
      - name: Compatibility tests
        run: go test -count=1 -run Compat -v ./internal/pki/
        env:
          TW_EASYRSA_DIR: ${{ runner.temp }}/easyrsa

  # Real OpenVPN server + client on the runner, using tunnelward's PKI and profiles.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install openvpn
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openvpn
      - name: tls-crypt-v2 unit tests
        run: go test -count=1 -v -run TLSCryptV2 ./internal/ovpn/
      - name: Build (with UI)
        run: make ui build
      - name: End-to-end
        run: sudo test/e2e/run.sh bin/tunnelward

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
