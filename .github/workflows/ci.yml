name: CI

# Go tests, UI type-check, PKI compatibility with the real easyrsa, an end-to-end
# run with a real OpenVPN server and clients, and lint. Docker images: docker-publish.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: make build && ./bin/trapdoor version

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type-check and build
        run: make ui

  # PKI compatibility against the real easyrsa + openssl CLIs.
  compat:
    runs-on: ubuntu-latest
    env:
      EASYRSA_VERSION: 3.2.7
      EASYRSA_SHA256: 308743bc9fe871b902d47dbe98d749daff3a05b27531684f02625ce7208d4598
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Download easyrsa
        run: |
          curl -fsSL -o easyrsa.tgz \
            "https://github.com/OpenVPN/easy-rsa/releases/download/v${EASYRSA_VERSION}/EasyRSA-${EASYRSA_VERSION}.tgz"
          echo "${EASYRSA_SHA256}  easyrsa.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/easyrsa"
          tar -xzf easyrsa.tgz -C "$RUNNER_TEMP/easyrsa" --strip-components=1
      - name: Compatibility tests
        run: go test -count=1 -run Compat -v ./internal/pki/
        env:
          TD_EASYRSA_DIR: ${{ runner.temp }}/easyrsa

  # Real OpenVPN server + client on the runner, using trapdoor's PKI and profiles.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install openvpn and oathtool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openvpn oathtool
      - name: Tests that need openvpn / oathtool
        run: |
          go test -count=1 -v -run TLSCryptV2 ./internal/ovpn/
          go test -count=1 -v -run Oathtool ./internal/clientauth/
      - name: Build (with UI)
        run: make ui build
      - name: End-to-end
        run: sudo test/e2e/run.sh bin/trapdoor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest
